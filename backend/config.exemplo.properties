# ATENCAO: o Spring le arquivos .properties como ISO-8859-1. Mantenha este arquivo
# sem acentos ou use escapes Unicode (ex.: Cantina A\u00e7a\u00ed).
#
# -- E-mail para recuperacao de senha (Gmail) ----------------------------------
# 1. Na conta Google, ative a "Verificacao em duas etapas".
# 2. Gere uma "Senha de app" em https://myaccount.google.com/apppasswords
# 3. Use o e-mail completo e a senha de app (16 letras, sem espacos) abaixo.
spring.mail.username=seuemail@gmail.com
