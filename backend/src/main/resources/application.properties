spring.application.name=backend

# Pasta de dados (banco + config.properties), definida em PastaDados.java quando nao informada:
#   desenvolvimento: backend/dados (no projeto) | instalado: C:/PortoCabral/dados
# Para trocar: --app.dados.dir=C:/outra/pasta ou variavel de ambiente APP_DADOS_DIR

# Configuracoes locais fora do Git (ex.: credenciais de e-mail). Modelo: backend/config.exemplo.properties
spring.config.import=optional:file:${APP_CONFIG_PATH:${app.dados.dir}/config.properties}

# -- Banco de dados: Firebird 5 embarcado -------------------------------------
# O arquivo .fdb e criado automaticamente na primeira execucao, dentro da pasta de dados.
# Para apontar outro arquivo: --app.db.path=C:/caminho/PORTOCABRAL.FDB (ou variavel de ambiente APP_DB_PATH)
app.db.path=${APP_DB_PATH:${app.dados.dir}/PORTOCABRAL.FDB}

spring.datasource.url=jdbc:firebirdsql:embedded:${app.db.path}?charSet=UTF-8&createDatabaseIfNotExist=true&set_db_charset=UTF8&defaultResultSetHoldable=true
spring.datasource.username=SYSDBA
spring.datasource.password=
spring.datasource.driver-class-name=org.firebirdsql.jdbc.FBDriver
# defaultResultSetHoldable: evita "The result set is closed" quando o Hibernate faz consultas
# aninhadas em modo auto-commit (recomendacao do Jaybird para uso com Hibernate)
# Embarcado: apenas este processo acessa o arquivo
spring.datasource.hikari.maximum-pool-size=5

# Estrutura do banco versionada em src/main/resources/db/migration (Flyway)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.database-platform=org.hibernate.community.dialect.FirebirdDialect
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=false

#logging.level.org.springframework=DEBUG
#logging.level.org.hibernate=DEBUG
#logging.file.name=app.log

# -- E-mail (recuperacao de senha) --------------------------------------------
# Usuario e senha de app do Gmail ficam no config.properties externo (spring.mail.username / spring.mail.password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8
app.mail.remetente-nome=Porto Cabral

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo

server.port=8080
server.address=127.0.0.1
